name: DevSecOps Code Quality Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses:  actions/checkout@v4.1.1


    - name: Set up Python
      uses: actions/setup-python@v5.1.0

      with:
        python-version: '3.10'

    - name: Install Code Scanners
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Syntax & Security Linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
